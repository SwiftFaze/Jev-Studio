name: Auto-merge into develop

# Turns on GitHub's auto-merge for every pull request into develop: once the required checks pass, it is squash-merged
# (one Conventional Commit per PR) and its branch is deleted. Release PRs are left for a person to merge, because
# merging one is what cuts a release.

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge when checks pass
        env:
          # A merge is attributed to whoever's token enabled auto-merge, and a merge by the default token does not start
          # other workflows: CI and Release would never run on develop. So use the release token, and fall back to the
          # default token (the PR still merges, but a person must then run the release workflow by hand).
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::warning title=Auto-merge::The release token could not enable auto-merge, so the default token was used. Its merge will not start the Release workflow."
            GH_TOKEN="$FALLBACK_TOKEN" gh pr merge --auto --squash "$PR_URL"
          fi
