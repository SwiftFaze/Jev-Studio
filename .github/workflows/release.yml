name: Release

# release-please watches develop. It keeps one "chore: release x.y.z" pull request open (version bump + CHANGELOG, worked
# out from the Conventional Commit messages). Merging that PR creates the tag and the GitHub release, and this
# workflow then builds the app on each OS and attaches the downloads to it.
#
# The release PR is opened with RELEASE_PLEASE_TOKEN rather than the default token, because pull requests created by
# the default token do not start other workflows, so CI would never run on it.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.label }}
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --package
      - name: Smoke test the executable
        shell: bash
        run: node scripts/smoke.mjs dist/jev-studio-*
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/release/* --clobber
